<html lang="en">
<head>
    <title>A Simple SPA For Foods</title>
    <script type="application/javascript">
        function fetchAndDisplayFoods() {
            fetchFoods()
                .then(foods => displayFoods(foods))
        }

        function fetchFoods() {
            return fetch(
                "/foods",
                {
                    headers: { 'Accept': 'application/json' }
                }
            ).then(resp => resp.json());
        }

        function displayFoods(foods) {
            const foodsTableBody = document.getElementById("foodsTableBody")
            foodsTableBody.innerHTML = "";
            foods.forEach(food => {
                const newRow = foodRow(food);
                foodsTableBody.appendChild(newRow);
            });
        }

        function foodRow(food) {
            return tr([
                td(food.name),
                td(food.brand),
                td(food.category),
                td(food.datePurchased),
                td(food.expiryDate),
                td(food.comment),
                td(food.amount),
                tdDeleteButton(food.id)
            ]);
        }

        function tr(children) {
            const node = document.createElement("tr");
            children.forEach(child => node.appendChild(child));
            return node;
        }

        function td(text) {
            const node = document.createElement("td");
            node.appendChild(document.createTextNode(text ?? ""));
            return node;
        }

        function tdDeleteButton(id) {
            const button = document.createElement("button");
            button.textContent = "Delete";
            button.style.color = "red";
            button.onclick = () => deleteFood(id);
            const node = document.createElement("td");
            node.appendChild(button);
            return node;
        }

        async function deleteFood(id) {
            if (!confirm(`Delete food #${id} ?`)) return;
            const resp = await fetch(`/foods/${id}`, { method: "DELETE" });
            if (resp.ok) {
                alert("Food deleted");
                fetchAndDisplayFoods();
            } else {
                alert("Delete failed: " + resp.status);
            }
        }
    </script>
</head>
<body>
<h1>Viewing Foods Via JS</h1>
<form action="javascript:fetchAndDisplayFoods()">
    <input type="submit" value="View The Foods">
</form>
<table>
    <thead>
    <tr><th>Name</th><th>Brand</th><th>Category</th><th>Date Purchased</th><th>Expiry Date</th><th>Comment</th><th>Amount</th><th>Action</th></tr>
    </thead>
    <tbody id="foodsTableBody">
    </tbody>
</table>
</body>
</html>
